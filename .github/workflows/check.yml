name: Einträge prüfen

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate -- --require-en
      - run: npm run generate && git diff --exit-code README.md README.en.md README-copilot.md README-copilot.en.md || (echo "README.md ist nicht aktuell. Bitte 'npm run generate' ausführen." && exit 1)
